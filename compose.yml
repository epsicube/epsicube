x-epsicube-common: &epsicube-common
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: pgsql
    DB_DATABASE: ${DB_DATABASE:-epsicube}
    DB_USERNAME: ${DB_USERNAME:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    SERVER_NAME: ${SERVER_NAME:-:80}

    # Mercure
    BROADCAST_CONNECTION: mercure
    MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-ChangeThisSecretBeforeProductionSecureKey}
    MERCURE_URL: http://web/.well-known/mercure
    MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-http://localhost/.well-known/mercure}
    MERCURE_TRUSTED_ISSUERS: ${APP_URL:-http://localhost}
    MERCURE_COOKIE_NAME: ${MERCURE_COOKIE_NAME:-mercure_access_token}
  volumes:
    - './:/app'
  networks:
    - epsicube

x-epsicube-build: &epsicube-build
  context: .docker/epsicube
  args:
    DOCKER_GID: '${DOCKER_GID:-999}'
    DOCKER_UID: '${DOCKER_UID:-999}'
    PHP_EXTENSIONS: '${PHP_EXTENSIONS:-bcmath curl intl mailparse mbstring opcache pcntl pdo_sqlite pdo_pgsql pgsql readline sockets xml zip}'

x-epsicube-cli: &epsicube-cli
  <<: *epsicube-common
  restart: unless-stopped
  build:
    <<: *epsicube-build
    target: cli

services:
  web:
    <<: *epsicube-common
    restart: unless-stopped
    build:
      <<: *epsicube-build
      target: web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

  worker:
    <<: *epsicube-cli
    init: true
    command: [ "php", "artisan", "epsicube:work" ]
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'artisan epsicube:work' || exit 1" ]
      interval: 30s
      timeout: 5s
      start_period: 3s
      retries: 3

  queue:
    <<: *epsicube-cli
    command: [ "php", "artisan", "queue:work", "--tries=3", "--max-time=3600", "--sleep=3" ]
    stop_grace_period: 60s
    healthcheck:
      test: [ "CMD-SHELL", "php artisan epsicube:queue-heartbeat --max-age=300 || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

  schedule:
    <<: *epsicube-cli
    command: [ "supercronic", "/home/nonroot/crontab" ]
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -x supercronic > /dev/null || exit 1" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  pgsql:
    build:
      context: .docker/postgres
    restart: unless-stopped
    environment:
      PGPASSWORD: '${DB_PASSWORD:-secret}'
      POSTGRES_DB: '${DB_DATABASE:-epsicube}'
      POSTGRES_USER: '${DB_USERNAME:-postgres}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'

      BACKUP_ENABLED: '${BACKUP_ENABLED:-false}'
      BACKUP_FULL_CRON: '${BACKUP_FULL_CRON:-0 3 * * 0}'
      BACKUP_DIFF_CRON: '${BACKUP_DIFF_CRON:-0 3 * * 1-6}'
      BACKUP_INCR_CRON: '${BACKUP_INCR_CRON:-0 0-2,4-23 * * *}'
      BACKUP_FULL_RETENTION: '${BACKUP_FULL_RETENTION:-52}'
      BACKUP_DIFF_RETENTION: '${BACKUP_DIFF_RETENTION:-31}'
      BACKUP_ARCHIVE_RETENTION: '${BACKUP_ARCHIVE_RETENTION:-31}'
    volumes:
      - 'pgsql:/var/lib/postgresql'
      - 'backups:/var/lib/pgbackrest'
    networks:
      - epsicube
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-epsicube}", "-U", "${DB_USERNAME:-postgres}" ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s

  #-----------------------------------------------------------DEV-------------------------------------------------------
  mailpit:
    profiles: [ 'dev' ]
    restart: unless-stopped
    image: "axllent/mailpit:v1.28.2"
    ports:
      - '8025:8025'
    networks:
      - epsicube

  pgadmin:
    profiles: [ 'dev' ]
    restart: unless-stopped
    depends_on:
      pgsql:
        condition: service_healthy
    image: "dpage/pgadmin4:9"
    ports:
      - "8015:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@epsicube.dev
      PGADMIN_DEFAULT_PASSWORD: secret
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    networks:
      - epsicube
volumes:
  pgsql:
  backups:
  pgadmin:

networks:
  epsicube:
    driver: bridge
